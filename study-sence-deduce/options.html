<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>study-sence-deduce 設定</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; max-width: 960px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  h2 { font-size: 14px; margin: 16px 0 8px; }
  .set { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
  .set-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-head input { flex: 1; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #e5e5e5; padding: 4px 6px; text-align: left; }
  th { background: #f7f7f7; font-weight: 500; }
  input[type="text"], input[type="color"] { box-sizing: border-box; width: 100%; padding: 4px; font: inherit; }
  button { font: inherit; padding: 4px 10px; cursor: pointer; }
  button.danger { color: #b00; }
  .actions { margin-top: 8px; display: flex; gap: 8px; }
  .help { color: #666; font-size: 12px; margin: 8px 0 16px; }
</style>
</head>
<body>
  <h1>study-sence-deduce 設定</h1>
  <p class="help">
    <code>hostPattern</code> は <code>*.dev.example.com</code> 形式のワイルドカード。
    <code>:</code> 以降にポートを書くと一致必須（例: <code>localhost:3000</code>）。ポート未指定はポート問わず一致。
    <code>hostTemplate</code> はスイッチ・テンプレ呼び出し時に使う具体的なホスト[:ポート]。
    <code>*</code> を入れると（例: <code>pr-*.dev.example.com</code>）切替時に値の入力が求められ、入力値は72時間使われなければ自動で消えるわ。
  </p>
  <div id="root"></div>
  <div class="actions">
    <button id="add-set">セットを追加</button>
  </div>
  <script type="module" src="/src/options.ts"></script>
</body>
</html>
