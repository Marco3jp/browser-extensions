<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>nicoverlay 設定</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; border-bottom: 1px solid #ccc; }
    label { display: block; margin: 10px 0; }
    input[type=text], textarea { width: 100%; box-sizing: border-box; font: inherit; }
    textarea { font-family: ui-monospace, monospace; }
    .row { display: flex; gap: 8px; align-items: center; }
    .msg { color: #666; } .err { color: #c00; }
    small { color: #666; display: block; }
  </style>
</head>
<body>
  <h1>nicoverlay 設定</h1>

  <h2>バックエンド</h2>
  <label>サーバーアドレス
    <input type="text" id="serverUrl" placeholder="http://localhost:8787"></label>
  <div class="row">
    <button id="saveServer">保存</button>
    <button id="test">接続テスト</button>
    <span id="serverMsg" class="msg"></span>
  </div>

  <h2>コメント取得</h2>
  <label><input type="checkbox" id="usePastLog"> 過去ログも取得する（プレミアム会員）</label>
  <small>有効にすると、ブラウザのニコニコのログイン情報（user_session）をバックエンドに送ります。
    送信先がローカル（localhost / 127.0.0.1）の場合のみ送ります。</small>
  <span id="pastLogMsg" class="msg"></span>

  <h2>表示</h2>
  <label>コメントの不透明度 <span id="opacityVal"></span>
    <input type="range" id="opacity" min="0.1" max="1" step="0.05"></label>

  <h2>NG</h2>
  <div id="ng"></div>

  <script src="options.js"></script>
</body>
</html>
