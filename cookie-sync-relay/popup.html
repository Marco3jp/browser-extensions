<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Sync Relay</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      font-size: 13px;
      width: 380px;
      margin: 0;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid #ddd;
    }
    .tab-bar button {
      flex: 1;
      padding: 8px 0;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      font-size: 13px;
      color: #666;
    }
    .tab-bar button.active {
      color: #4a90e2;
      border-bottom-color: #4a90e2;
      font-weight: bold;
    }

    .tab-content { display: none; padding: 12px; }
    .tab-content.active { display: block; }

    /* Status tab */
    .status-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 6px;
      background: #f5f5f5;
      margin-bottom: 10px;
    }
    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-gray          { background: #969696; }
    .dot-green         { background: #00b450; }
    .dot-green_deduped {
      background: #00b450;
      box-shadow: 4px 4px 0 1px #fff, 4px 4px 0 2.5px #d2aa00;
    }
    .dot-yellow { background: #d2aa00; }
    .dot-orange { background: #ff8c00; }
    .dot-red    { background: #dc3232; }
    .dot-blue   { background: #1e78dc; }
    .dot-blue_deduped {
      background: #1e78dc;
      box-shadow: 4px 4px 0 1px #fff, 4px 4px 0 2.5px #d2aa00;
    }
    .dot-purple { background: #8c3cc8; }

    .status-label {
      font-weight: bold;
      font-size: 13px;
    }

    .status-message {
      font-size: 12px;
      line-height: 1.6;
      padding: 8px 10px;
      border-radius: 5px;
      border-left: 3px solid #ccc;
      background: #fafafa;
      color: #444;
    }
    .status-message.warn  { border-color: #f0a000; background: #fffbe6; }
    .status-message.error { border-color: #c00; background: #fff5f5; }
    .status-message.info  { border-color: #4a90e2; background: #f0f6ff; }

    /* Duplicate cookie list */
    .dup-list { list-style: none; padding: 0; margin: 8px 0 0; }
    .dup-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      background: #fff8e6;
      border: 1px solid #f0c040;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .dup-info { flex: 1; font-size: 12px; display: flex; flex-direction: column; gap: 1px; }
    .dup-name { font-weight: bold; }
    .dup-domain { color: #666; }
    .dup-delete-btn {
      font-size: 11px;
      padding: 3px 8px;
      background: none;
      border: 1px solid #c00;
      color: #c00;
      border-radius: 3px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .dup-delete-btn:hover { background: #fff0f0; }

    /* Settings tab */
    .field-label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 3px;
    }
    input[type="text"] {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .targets-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    #add-target-btn {
      font-size: 11px;
      padding: 2px 8px;
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
    }
    #add-target-btn:hover { background: #ddd; }

    .target-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
    }
    .target-row .t-url    { flex: 2; min-width: 0; }
    .target-row .t-domain { flex: 1; min-width: 0; }
    .target-row .t-url:disabled,
    .target-row .t-domain:disabled { background: #f0f0f0; color: #aaa; }
    .target-row .t-or { font-size: 11px; color: #999; white-space: nowrap; flex-shrink: 0; }
    .target-row .remove-btn {
      background: none;
      border: none;
      color: #c00;
      font-size: 15px;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .target-row .remove-btn:disabled { color: #ccc; cursor: default; }

    #edit-mode-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 5px 8px;
      background: #fff8e6;
      border: 1px solid #f0c040;
      border-radius: 4px;
      font-size: 12px;
      color: #7a5800;
    }
    #cancel-edit-btn {
      font-size: 11px;
      padding: 2px 8px;
      background: none;
      border: 1px solid #aaa;
      border-radius: 3px;
      cursor: pointer;
      color: #555;
    }
    #cancel-edit-btn:hover { background: #eee; }

    #save-btn {
      margin-top: 8px;
      width: 100%;
      padding: 6px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    #save-btn:hover { background: #357abd; }

    .edit-rule-btn {
      font-size: 11px;
      padding: 2px 8px;
      background: none;
      border: 1px solid #4a90e2;
      color: #4a90e2;
      border-radius: 3px;
      cursor: pointer;
    }
    .edit-rule-btn:hover { background: #f0f6ff; }

    hr { margin: 14px 0; border: none; border-top: 1px solid #eee; }

    #rules-list { list-style: none; padding: 0; margin: 0; }
    #rules-list li {
      background: #f7f7f7;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .rule-meta { margin-bottom: 6px; }
    .rule-meta .source { font-weight: bold; }
    .rule-meta .keys { color: #666; font-size: 12px; }
    .rule-targets { margin: 2px 0 0; padding: 0 0 0 8px; list-style: disc; }
    .rule-target-item { font-size: 12px; color: #444; padding: 1px 0; }
    .rule-disabled { opacity: 0.5; }
    .rule-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
    .toggle-btn {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid;
    }
    .toggle-btn.enabled  { background: #e6f4ea; border-color: #34a853; color: #1a7a32; }
    .toggle-btn.disabled { background: #f0f0f0; border-color: #aaa;    color: #666; }
    .toggle-btn:hover { filter: brightness(0.95); }
    .sync-now-btn {
      font-size: 11px;
      padding: 2px 8px;
      background: none;
      border: 1px solid #4a90e2;
      color: #4a90e2;
      border-radius: 3px;
      cursor: pointer;
    }
    .sync-now-btn:hover:not(:disabled) { background: #f0f6ff; }
    .sync-now-btn:disabled { border-color: #aaa; color: #aaa; cursor: default; }
    .delete-rule-btn {
      font-size: 11px;
      padding: 2px 8px;
      background: none;
      border: 1px solid #c00;
      color: #c00;
      border-radius: 3px;
      cursor: pointer;
    }
    .delete-rule-btn:hover { background: #fff0f0; }
    #empty { color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <div class="tab-bar">
    <button class="active" data-tab="status">ステータス</button>
    <button data-tab="settings">設定</button>
  </div>

  <!-- Status tab -->
  <div id="tab-status" class="tab-content active">
    <div class="status-card">
      <div id="status-dot" class="status-dot dot-gray"></div>
      <div id="status-label" class="status-label">確認中...</div>
    </div>
    <div id="status-message" class="status-message" style="display:none"></div>
    <div id="duplicates-container"></div>
  </div>

  <!-- Settings tab -->
  <div id="tab-settings" class="tab-content">
    <span class="field-label">Source Domain</span>
    <input id="sourceDomain" type="text" placeholder=".staging.example.com" />

    <span class="field-label">Cookie Keys（カンマ区切り、空欄で全て）</span>
    <input id="keys" type="text" placeholder="_session, token" />

    <div class="targets-header">
      <span>Targets</span>
      <button id="add-target-btn">＋ Target追加</button>
    </div>
    <div id="new-target-rows"></div>

    <div id="edit-mode-bar">
      <span id="edit-mode-label"></span>
      <button id="cancel-edit-btn">キャンセル</button>
    </div>
    <button id="save-btn">ルールを追加</button>

    <hr />

    <div id="empty" style="display:none">ルールはありません</div>
    <ul id="rules-list"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
